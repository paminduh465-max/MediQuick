name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages and pushing to gh-pages branch
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Note: cache is intentionally omitted here to prevent runner crashes
          # when lockfiles differ between environments.

      - name: Install dependencies
        run: npm install --no-audit

      - name: Build production bundle
        run: npm run build

      - name: Ensure GitHub Pages static routing fallbacks
        run: |
          touch dist/.nojekyll
          if [ -f dist/index.html ] && [ ! -f dist/404.html ]; then
            cp dist/index.html dist/404.html
          fi

      # Deployment Path 1: Push compiled dist to gh-pages branch (works with default "Deploy from a branch" setting)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Deployment Path 2: Deploy directly via GitHub Pages Actions (works if "GitHub Actions" source is selected)
      - name: Setup GitHub Pages environment
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
